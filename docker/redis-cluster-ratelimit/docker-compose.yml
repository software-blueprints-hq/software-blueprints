version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: blueprints-redis
    ports:
      - "6379:6379"
    command: >
      redis-server --save ""
                   --appendonly no
                   --maxmemory 512mb
                   --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: blueprints-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  redisdata:
