version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: blueprints-neo4j-graphrag
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: neo4j/blueprint_graph_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4jdata:/data

volumes:
  neo4jdata:
