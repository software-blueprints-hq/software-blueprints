<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow aura -->
  <circle cx="100" cy="100" r="70" fill="url(#cyberIndigo)" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Isometric Architecture Cube -->
  <!-- Top Face -->
  <polygon points="100,32 158,66 100,100 42,66" fill="url(#cubeTop)" stroke="url(#cyberIndigo)" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Left Face -->
  <polygon points="42,66 100,100 100,168 42,134" fill="#0b0f19" fill-opacity="0.85" stroke="url(#cyberIndigo)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Right Face -->
  <polygon points="100,100 158,66 158,134 100,168" fill="#0f172a" fill-opacity="0.95" stroke="url(#cyberIndigo)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Blueprint Architectural Grid Lines -->
  <!-- Top grid -->
  <line x1="71" y1="49" x2="129" y2="83" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3 3" />
  <line x1="129" y1="49" x2="71" y2="83" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3 3" />

  <!-- Left grid -->
  <line x1="42" y1="100" x2="100" y2="134" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" />
  <line x1="71" y1="83" x2="71" y2="151" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Right grid -->
  <line x1="100" y1="134" x2="158" y2="100" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" />
  <line x1="129" y1="83" x2="129" y2="151" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Central Glowing Nexus Node -->
  <circle cx="100" cy="100" r="5.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="100" cy="100" r="3" fill="#ffffff" />

  <!-- Corner Anchor Pins -->
  <circle cx="100" cy="32" r="3" fill="#a855f7" />
  <circle cx="158" cy="66" r="3" fill="#6366f1" />
  <circle cx="158" cy="134" r="3" fill="#38bdf8" />
  <circle cx="100" cy="168" r="3" fill="#6366f1" />
  <circle cx="42" cy="134" r="3" fill="#38bdf8" />
  <circle cx="42" cy="66" r="3" fill="#a855f7" />
</svg>
