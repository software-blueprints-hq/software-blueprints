<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#06080d" />

  <!-- Ambient Glow Gradients -->
  <circle cx="200" cy="150" r="280" fill="#6366f1" opacity="0.12" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="320" fill="#38bdf8" opacity="0.10" filter="blur(90px)" />
  <circle cx="600" cy="300" r="200" fill="#a855f7" opacity="0.08" filter="blur(100px)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />

    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Cyber Badge -->
  <rect x="120" y="110" width="370" height="38" rx="19" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="140" cy="129" r="5" fill="#38bdf8" />
  <text x="156" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e0e7ff" letter-spacing="0.5">67 PRODUCTION ARCHITECTURES • 7 PILLARS</text>

  <!-- Main Headline -->
  <text x="120" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Software Blueprints</text>

  <!-- Gradient Subtitle -->
  <text x="120" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#94a3b8">The Definitive Open-Source Architecture Vault</text>

  <text x="120" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#64748b">
    Battle-tested PostgreSQL schemas • Distributed Go, Rust, Python pipelines • 
  </text>
  <text x="120" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#64748b">
    Multi-Agent loops • Accessible React components • One-click CLI scaffolder
  </text>

  <!-- Terminal / CLI Preview Card -->
  <rect x="120" y="445" width="580" height="70" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <circle cx="145" cy="480" r="5" fill="#ef4444" />
  <circle cx="162" cy="480" r="5" fill="#eab308" />
  <circle cx="179" cy="480" r="5" fill="#22c55e" />
  <text x="205" y="486" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="500" fill="#38bdf8">$ npx software-blueprints add</text>
  <text x="515" y="486" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="500" fill="#a855f7">sys-saga</text>

  <!-- Architectural Cube Graphic on Right Side -->
  <g transform="translate(860, 260) scale(1.6)">
    <!-- Top Face -->
    <polygon points="100,32 158,66 100,100 42,66" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="2" />
    <!-- Left Face -->
    <polygon points="42,66 100,100 100,168 42,134" fill="#0b0f19" fill-opacity="0.9" stroke="#6366f1" stroke-width="2" />
    <!-- Right Face -->
    <polygon points="100,100 158,66 158,134 100,168" fill="#0f172a" fill-opacity="0.95" stroke="#a855f7" stroke-width="2" />

    <circle cx="100" cy="100" r="6" fill="#38bdf8" />
    <circle cx="100" cy="32" r="4" fill="#a855f7" />
    <circle cx="158" cy="66" r="4" fill="#6366f1" />
    <circle cx="158" cy="134" r="4" fill="#38bdf8" />
    <circle cx="100" cy="168" r="4" fill="#6366f1" />
    <circle cx="42" cy="134" r="4" fill="#38bdf8" />
    <circle cx="42" cy="66" r="4" fill="#a855f7" />
  </g>
</svg>
